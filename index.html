<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Blue Flash - Final Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #CCFF00; --bg: #0d0f05; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        
        .page { display: none; height: 100vh; width: 100%; position: fixed; top: 0; left: 0; background: var(--bg); overflow-y: auto; padding-bottom: 80px; }
        .page.active { display: block !important; z-index: 100; }
        
        .neon-bg { background-color: var(--neon) !important; color: #000 !important; }
        .neon-text { color: var(--neon); }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 25px; }
        
        input, select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 16px; border-radius: 15px; width: 100%; outline: none; text-align: center; font-size: 1.1rem; }
        input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(204,255,0,0.2); }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 15px; z-index: 200; }
        .nav-btn { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.3); text-transform: uppercase; }
        .nav-btn.active { color: var(--neon); }
    </style>
</head>
<body>

    <div id="pg-login" class="page active flex flex-col items-center justify-center p-8">
        <h1 class="text-6xl font-black italic neon-text mb-2 tracking-tighter text-center">THE BLUE<br>FLASH</h1>
        <p class="opacity-30 text-[10px] tracking-[0.4em] mb-12">INTELLIGENT TRAINING</p>
        <button onclick="showPage('pg-onboarding')" class="w-full py-5 bg-white text-black font-black rounded-2xl flex items-center justify-center gap-3 shadow-2xl">
            <img src="https://www.google.com/favicon.ico" class="w-5"> الدخول السريع عبر Google
        </button>
    </div>

    <div id="pg-onboarding" class="page p-6">
        <h2 class="text-3xl font-black neon-text italic mb-8">تحليل البيانات</h2>
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <input id="u-age" type="number" placeholder="العمر">
                <input id="u-height" type="number" placeholder="الطول (سم)">
            </div>
            <input id="u-weight" type="number" placeholder="الوزن (كجم)">
            <select id="u-level">
                <option value="1.2">مبتدئ</option>
                <option value="1.5">متوسط</option>
                <option value="1.9">متقدم</option>
            </select>
            <h3 class="neon-text font-bold mt-6 mb-2">ماذا تريد أن تمرن اليوم؟</h3>
            <div id="goal-selector" class="grid grid-cols-2 gap-3">
                <button onclick="setGoal('صدر', this)" class="card p-4 text-xs font-bold goal-btn">صدر</button>
                <button onclick="setGoal('بطن', this)" class="card p-4 text-xs font-bold goal-btn">بطن</button>
                <button onclick="setGoal('سواعد', this)" class="card p-4 text-xs font-bold goal-btn">سواعد</button>
                <button onclick="setGoal('أقدام', this)" class="card p-4 text-xs font-bold goal-btn">أقدام</button>
                <button onclick="setGoal('كامل', this)" class="card p-4 text-xs font-bold goal-btn col-span-2">جسم كامل</button>
            </div>
            <button onclick="finishOnboarding()" class="w-full py-5 neon-bg font-black rounded-2xl shadow-lg mt-4">إنشاء البرنامج المخصص</button>
        </div>
    </div>

    <div id="pg-main" class="page p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black neon-text italic uppercase">الجدول المخصص</h2>
            <div id="user-display" class="text-[9px] opacity-40 font-bold"></div>
        </div>

        <div id="day-row" class="flex justify-between mb-8">
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">S</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">M</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">T</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">W</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">T</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">F</button>
            <button onclick="this.classList.toggle('neon-bg')" class="w-10 h-10 rounded-full card text-[10px] font-black">S</button>
        </div>

        <div id="exercise-container" class="space-y-4">
            </div>
    </div>

    <div id="pg-timer" class="page fixed inset-0 flex flex-col items-center justify-center p-6 text-center">
        <h3 id="ex-name" class="text-3xl font-black neon-text italic mb-2 tracking-tighter">PUSHUPS</h3>
        <div id="clock" class="text-8xl font-black italic mb-10 tracking-tighter">00:00</div>
        
        <div class="grid grid-cols-2 gap-4 w-full mb-10">
            <div class="card p-6">
                <div id="cur-cals" class="text-3xl font-black neon-text">0</div>
                <div class="text-[10px] opacity-40 font-bold uppercase mt-1">Kcal</div>
            </div>
            <div class="card p-6">
                <div id="cur-sets" class="text-3xl font-black italic">1 / 4</div>
                <div class="text-[10px] opacity-40 font-bold uppercase mt-1">Sets</div>
            </div>
        </div>

        <button onclick="handleSet()" class="w-full py-6 neon-bg font-black text-xl rounded-full shadow-2xl mb-6">إنهاء المجموعة (SET)</button>
        <button onclick="exitEx()" class="text-red-500 font-bold uppercase text-[10px] tracking-widest opacity-50">إيقاف التمرين كلياً</button>
    </div>

    <nav class="nav-bar">
        <button onclick="showPage('pg-main')" class="nav-btn active">الجدول</button>
        <button onclick="showPage('pg-onboarding')" class="nav-btn">حسابي</button>
    </nav>

    <script>
        // داتابيز الـ 50 تمرين
        const db = {
            "صدر": [
                {n: "Pushups", r: 8}, {n: "Wide Pushups", r: 9}, {n: "Diamond Pushups", r: 10}, 
                {n: "Incline Pushups", r: 7}, {n: "Decline Pushups", r: 11}, {n: "Archer Pushups", r: 13},
                {n: "Chest Dips", r: 12}, {n: "Clap Pushups", r: 15}, {n: "One Arm Prep", r: 14}, {n: "Pseudo Pushups", r: 12}
            ],
            "بطن": [
                {n: "Crunches", r: 5}, {n: "Leg Raises", r: 6}, {n: "Plank", r: 4}, {n: "Russian Twist", r: 7},
                {n: "Mountain Climbers", r: 8}, {n: "Bicycle Crunches", r: 7}, {n: "V-Sits", r: 9},
                {n: "Hollow Body", r: 5}, {n: "Flutter Kicks", r: 6}, {n: "Toe Touches", r: 7}
            ],
            "سواعد": [
                {n: "Wrist Curls", r: 4}, {n: "Reverse Curls", r: 5}, {n: "Finger Pushups", r: 12},
                {n: "Dead Hang", r: 3}, {n: "Towel Pull", r: 8}, {n: "Knuckle Pushups", r: 10},
                {n: "Forearm Plank", r: 4}, {n: "Farmer Walk Prep", r: 6}, {n: "Grip Squeeze", r: 3}, {n: "Wrist Rotations", r: 2}
            ],
            "أقدام": [
                {n: "Squats", r: 8}, {n: "Lunges", r: 7}, {n: "Calf Raises", r: 4}, {n: "Bulgarian Split", r: 11},
                {n: "Sumo Squats", r: 9}, {n: "Wall Sit", r: 5}, {n: "Box Jumps", r: 13},
                {n: "Glute Bridge", r: 6}, {n: "Pistol Squat Prep", r: 15}, {n: "Side Lunges", r: 8}
            ],
            "كامل": [
                {n: "Burpees", r: 15}, {n: "Jumping Jacks", r: 7}, {n: "Bear Crawl", r: 10}, {n: "High Knees", r: 9},
                {n: "Spiderman Pushups", r: 12}, {n: "Plank Jacks", r: 8}, {n: "Star Jumps", r: 14},
                {n: "Clean & Press Prep", r: 13}, {n: "Navy Seals", r: 18}, {n: "T-Pushups", r: 11}
            ]
        };

        let app = {
            user: { age: 20, weight: 50, height: 165, level: 1.2, goal: 'كامل' },
            session: { sec: 0, sets: 1, interval: null, currentRate: 0 }
        };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // تحديث حالة أزرار النقل
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(id === 'pg-main') document.querySelectorAll('.nav-btn')[0].classList.add('active');
        }

        function setGoal(goal, btn) {
            app.user.goal = goal;
            document.querySelectorAll('.goal-btn').forEach(b => b.classList.remove('neon-bg'));
            btn.classList.add('neon-bg');
        }

        function finishOnboarding() {
            app.user.age = document.getElementById('u-age').value || 20;
            app.user.weight = document.getElementById('u-weight').value || 50;
            app.user.height = document.getElementById('u-height').value || 165;
            app.user.level = document.getElementById('u-level').value;
            
            document.getElementById('user-display').innerText = `${app.user.weight}KG | ${app.user.height}CM | LVL ${app.user.level}`;
            buildWorkout();
            showPage('pg-main');
        }

        function buildWorkout() {
            const container = document.getElementById('exercise-container');
            container.innerHTML = "";
            const list = db[app.user.goal] || db['كامل'];
            
            list.forEach(ex => {
                container.innerHTML += `
                    <div onclick="startEx('${ex.n}', ${ex.r})" class="card p-5 flex justify-between items-center active:scale-95 transition-transform">
                        <div>
                            <h4 class="font-black italic">${ex.n}</h4>
                            <p class="text-[9px] opacity-30 font-bold uppercase tracking-widest">4 Sets | 12 Reps</p>
                        </div>
                        <div class="neon-text font-black">START</div>
                    </div>
                `;
            });
        }

        function startEx(name, rate) {
            app.session.sec = 0;
            app.session.sets = 1;
            app.session.currentRate = rate;
            
            document.getElementById('ex-name').innerText = name.toUpperCase();
            document.getElementById('cur-sets').innerText = "1 / 4";
            document.getElementById('clock').innerText = "00:00";
            showPage('pg-timer');
            
            clearInterval(app.session.interval);
            app.session.interval = setInterval(() => {
                app.session.sec++;
                updateTimerUI();
            }, 1000);
        }

        function updateTimerUI() {
            let m = Math.floor(app.session.sec / 60);
            let s = app.session.sec % 60;
            document.getElementById('clock').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            
            // معادلة السعرات الاحترافية (Mifflin-St Jeor + Activity Level)
            let bmr = (10 * app.user.weight) + (6.25 * app.user.height) - (5 * app.user.age) + 5;
            let burned = Math.floor(((app.session.sec / 3600) * (bmr * app.user.level)) * (app.session.currentRate / 5));
            document.getElementById('cur-cals').innerText = burned;
        }

        function handleSet() {
            if(app.session.sets < 4) {
                app.session.sets++;
                document.getElementById('cur-sets').innerText = `${app.session.sets} / 4`;
                alert("انتهت المجموعة! خذ نفساً عميقاً.");
            } else {
                alert("عمل رائع! تم إكمال التمرين.");
                exitEx();
            }
        }

        function exitEx() {
            clearInterval(app.session.interval);
            showPage('pg-main');
        }

        window.onload = () => showPage('pg-login');
    </script>
</body>
</html>
