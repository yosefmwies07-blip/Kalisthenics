<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blue Flash - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0f05; color: #fff; overflow-x: hidden; }
        .neon-border { box-shadow: 0 0 15px rgba(204,255,0,0.3); border: 1px solid #CCFF00; }
        .hidden-page { display: none; }
        .active-page { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <main id="main-page" class="p-6 active-page mb-24">
        <h1 class="text-[#CCFF00] text-3xl font-black mb-6 uppercase tracking-tighter">The Blue Flash</h1>
        
        <section class="mb-8">
            <p class="text-white/50 text-xs mb-3 font-bold uppercase tracking-widest">Schedule Days</p>
            <div id="day-selector" class="flex justify-between">
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">S</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">M</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">T</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">W</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">T</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">F</button>
                <button class="w-10 h-10 rounded-full bg-white/5 text-white/30 font-bold text-xs transition-all">S</button>
            </div>
        </section>

        <h2 class="text-2xl font-black italic mb-4">EXERCISES</h2>
        <div class="space-y-4">
            <div onclick="openExercise('Wide Pull-ups', '7', 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJleXJueXp4bmR6NXp4bmR6NXp4bmR6NXp4bmR6NXp4bmR6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxVfFZYMPl6/giphy.gif')" class="bg-[#1a1d0d] p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:bg-[#252a12] transition-all">
                <div class="w-16 h-16 bg-black rounded-2xl overflow-hidden"><img src="https://placehold.co/100x100/black/CCFF00?text=PULL" class="w-full h-full"></div>
                <div class="flex-1">
                    <h3 class="font-bold">WIDE PULL-UPS</h3>
                    <p class="text-xs text-white/50 uppercase">Strength • Back</p>
                </div>
                <div class="text-right text-[#CCFF00] font-black text-xl">4 <span class="text-[10px] block text-white/50 uppercase">Sets</span></div>
            </div>

            <div onclick="openExercise('Diamond Pushups', '5', 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJleXJueXp4bmR6NXp4bmR6NXp4bmR6NXp4bmR6NXp4bmR6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxVfFZYMPl6/giphy.gif')" class="bg-[#1a1d0d] p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:bg-[#252a12] transition-all">
                <div class="w-16 h-16 bg-black rounded-2xl overflow-hidden"><img src="https://placehold.co/100x100/black/CCFF00?text=PUSH" class="w-full h-full"></div>
                <div class="flex-1">
                    <h3 class="font-bold">DIAMOND PUSHUPS</h3>
                    <p class="text-xs text-white/50 uppercase">Endurance • Chest</p>
                </div>
                <div class="text-right text-[#CCFF00] font-black text-xl">3 <span class="text-[10px] block text-white/50 uppercase">Sets</span></div>
            </div>
        </div>
    </main>

    <section id="workout-page" class="hidden-page fixed inset-0 bg-black z-50 p-6">
        <button onclick="closeExercise()" class="text-[#CCFF00] mb-6">← Back</button>
        <h2 id="ex-title" class="text-3xl font-black italic mb-2 uppercase">PUSHUPS</h2>
        <div class="w-full aspect-video bg-[#1a1d0d] rounded-3xl mb-6 overflow-hidden flex items-center justify-center">
            <img id="ex-gif" src="" class="w-full h-full object-cover">
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-[#1a1d0d] p-4 rounded-3xl text-center">
                <p id="workout-timer" class="text-4xl font-black text-[#CCFF00]">00:00</p>
                <p class="text-[10px] text-white/50 uppercase">Time Elapsed</p>
            </div>
            <div class="bg-[#1a1d0d] p-4 rounded-3xl text-center">
                <p id="ex-calories" class="text-4xl font-black text-[#CCFF00]">0</p>
                <p class="text-[10px] text-white/50 uppercase">Est. Calories</p>
            </div>
        </div>

        <button id="finish-btn" class="w-full py-5 bg-[#CCFF00] text-black font-black text-xl rounded-full shadow-[0_0_20px_rgba(204,255,0,0.4)]">FINISH SET</button>
    </section>

    <section id="stats-page" class="hidden-page p-6 mb-24">
        <h2 class="text-3xl font-black italic mb-8">MY PROGRESS</h2>
        <div class="bg-[#CCFF00] p-6 rounded-[40px] text-black mb-4">
            <p class="font-bold uppercase text-xs opacity-60 mb-1">Total Calories Today</p>
            <h3 id="total-cal" class="text-6xl font-black italic">0</h3>
        </div>
        <div class="bg-white/5 p-6 rounded-[40px] border border-white/10">
            <p class="text-white/50 uppercase text-xs mb-1 font-bold">Total Active Time</p>
            <h3 id="total-time" class="text-4xl font-black tracking-tighter">00:00</h3>
        </div>
    </section>

    <nav class="fixed bottom-0 left-0 w-full bg-black/80 backdrop-blur-xl border-t border-white/10 p-4 flex justify-around">
        <button onclick="showPage('main-page')" class="flex flex-col items-center text-[#CCFF00]">
            <span class="text-xs font-black italic">TRAIN</span>
        </button>
        <button onclick="showPage('stats-page')" class="flex flex-col items-center text-white/30">
            <span class="text-xs font-black italic text-white/30">STATS</span>
        </button>
    </nav>

    <script>
        // المتغيرات العالمية لتخزين البيانات
        let totalCals = 0;
        let totalSeconds = 0;
        let activeTimer;
        let currentExCalRate = 0;
        let startTime;

        // 1. التبديل بين الصفحات
        function showPage(pageId) {
            document.querySelectorAll('main, section').forEach(p => p.classList.add('hidden-page'));
            document.getElementById(pageId).classList.remove('hidden-page');
            document.getElementById(pageId).classList.add('active-page');
        }

        // 2. فتح تمرين محدد
        function openExercise(title, calRate, gifUrl) {
            document.getElementById('workout-page').classList.remove('hidden-page');
            document.getElementById('ex-title').innerText = title;
            document.getElementById('ex-gif').src = gifUrl;
            currentExCalRate = calRate; // سعرات لكل دقيقة
            
            // بدء المؤقت
            let sec = 0;
            startTime = Date.now();
            clearInterval(activeTimer);
            activeTimer = setInterval(() => {
                sec++;
                let m = Math.floor(sec / 60);
                let s = sec % 60;
                document.getElementById('workout-timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                
                // حساب سعرات اللحظة
                let cal = Math.floor((sec / 60) * currentExCalRate);
                document.getElementById('ex-calories').innerText = cal;
            }, 1000);
        }

        // 3. إنهاء التمرين وحفظ البيانات
        function closeExercise() {
            clearInterval(activeTimer);
            document.getElementById('workout-page').classList.add('hidden-page');
        }

        document.getElementById('finish-btn').onclick = function() {
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let earnedCals = Math.floor((elapsedSec / 60) * currentExCalRate);
            
            totalSeconds += elapsedSec;
            totalCals += earnedCals;
            
            // تحديث واجهة الإحصائيات
            document.getElementById('total-cal').innerText = totalCals;
            let tm = Math.floor(totalSeconds / 60);
            let ts = totalSeconds % 60;
            document.getElementById('total-time').innerText = `${tm}:${ts < 10 ? '0'+ts : ts}`;
            
            alert(`تم الحفظ! حرقت ${earnedCals} سعرة في ${Math.floor(elapsedSec/60)} دقيقة.`);
            closeExercise();
        };

        // 4. تفعيل أزرار الأيام (تعدد الاختيار)
        document.querySelectorAll('#day-selector button').forEach(btn => {
            btn.onclick = function() {
                this.classList.toggle('bg-[#CCFF00]');
                this.classList.toggle('text-black');
                this.classList.toggle('neon-border');
            }
        });
    </script>
</body>
</html>
