<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Blue Flash - Professional Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #CCFF00; --bg: #0d0f05; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #fff; margin: 0; touch-action: manipulation; }
        .page { display: none; min-height: 100vh; width: 100%; background: var(--bg); position: fixed; top: 0; left: 0; overflow-y: auto; }
        .page.active { display: block !important; z-index: 100; }
        .neon-border { border: 1px solid var(--neon); box-shadow: 0 0 10px rgba(204,255,0,0.2); }
        .btn-main { background: var(--neon); color: #000; font-weight: 900; transition: all 0.2s; }
        .btn-main:active { transform: scale(0.95); opacity: 0.8; }
        input, select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 15px; width: 100%; outline: none; text-align: center; }
        input:focus { border-color: var(--neon); }
    </style>
</head>
<body>

    <div id="p-login" class="page active flex flex-col items-center justify-center p-8">
        <div class="mb-10 text-center">
            <h1 class="text-6xl font-black italic tracking-tighter" style="color: var(--neon)">THE BLUE<br>FLASH</h1>
            <p class="text-[10px] tracking-[0.5em] opacity-30 mt-2">STRENGTH & RECOVERY</p>
        </div>
        <button onclick="navTo('p-profile')" class="w-full py-5 bg-white text-black font-black rounded-2xl flex items-center justify-center gap-3 shadow-2xl">
            <img src="https://www.google.com/favicon.ico" class="w-5"> الدخول السريع بواسطة Google
        </button>
    </div>

    <div id="p-profile" class="page p-6">
        <h2 class="text-3xl font-black italic mb-8" style="color: var(--neon)">بروتوكول البيانات</h2>
        <div class="space-y-5">
            <div>
                <label class="text-[10px] opacity-40 block mb-2 mr-2">العمر الحالي</label>
                <input id="u-age" type="number" placeholder="مثال: 25">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] opacity-40 block mb-2 mr-2">الوزن (كجم)</label>
                    <input id="u-weight" type="number" placeholder="70">
                </div>
                <div>
                    <label class="text-[10px] opacity-40 block mb-2 mr-2">الطول (سم)</label>
                    <input id="u-height" type="number" placeholder="175">
                </div>
            </div>
            <div>
                <label class="text-[10px] opacity-40 block mb-2 mr-2">مستوى اللياقة الحالي</label>
                <select id="u-level">
                    <option value="1.2">مبتدئ (بداية الطريق)</option>
                    <option value="1.5">متوسط (تمارس الرياضة أحياناً)</option>
                    <option value="1.9">متقدم (رياضي محترف)</option>
                </select>
            </div>
            <button onclick="saveAndGo()" class="w-full py-5 btn-main rounded-2xl mt-6 shadow-[0_10px_30px_rgba(204,255,0,0.2)]">تحليل البيانات والبدء</button>
        </div>
    </div>

    <script>
        function navTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id);
            target.classList.add('active');
            if (id === 'p-login') target.style.display = 'flex';
        }

        function saveAndGo() {
            const data = {
                age: document.getElementById('u-age').value,
                weight: document.getElementById('u-weight').value,
                height: document.getElementById('u-height').value,
                level: document.getElementById('u-level').value
            };
            if(!data.age || !data.weight || !data.height) {
                alert("يرجى إكمال كافة البيانات لبناء بروتوكولك بدقة");
                return;
            }
            localStorage.setItem('user_protocol', JSON.stringify(data));
            // هنا سينتقل لصفحة الجدول في الجزء القادم
            alert("تم تحليل البيانات بنجاح!");
        }
    </script>
</body>
</html>
