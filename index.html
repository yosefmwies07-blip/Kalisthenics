<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Blue Flash - Final Protocol 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { --neon: #CCFF00; --bg: #0d0f05; --card: rgba(255,255,255,0.04); }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        
        /* نظام الصفحات الصارم */
        .page { 
            display: none; height: 100vh; width: 100%; position: fixed; 
            top: 0; left: 0; background: var(--bg); overflow-y: auto; 
            padding-bottom: 100px; z-index: 10;
        }
        .page.active { display: block !important; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* تصميم الكروت الاحترافية (مثل التطبيق المطلوب) */
        .ex-card { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 24px; padding: 16px; margin-bottom: 16px;
            display: flex; align-items: center; gap: 15px; transition: 0.3s;
        }
        .ex-card:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
        
        .neon-btn { 
            background: var(--neon); color: #000; font-weight: 900; 
            border-radius: 20px; padding: 18px; text-align: center;
            box-shadow: 0 10px 20px rgba(204,255,0,0.15); width: 100%;
        }

        /* شاشة الاستراحة (Pop-up) */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 1000; display: none; align-items: center; justify-content: center; p: 20px;
        }
        .modal-content { background: #1a1a1a; padding: 40px; border-radius: 35px; border: 1px solid var(--neon); text-align: center; width: 85%; }

        /* شريط التنقل السفلي */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px;
            background: rgba(13,15,5,0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: center; z-index: 500;
        }
        .nav-item { display: flex; flex-col; align-items: center; opacity: 0.3; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--neon); }
    </style>
</head>
<body>

    <div id="splash" class="fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center">
        <h1 class="text-6xl font-black italic text-[#CCFF00] mb-4">BLUE FLASH</h1>
        <div class="w-12 h-1 bg-[#CCFF00] animate-pulse rounded-full"></div>
    </div>

    <div id="pg-login" class="page flex flex-col items-center justify-center p-10">
        <div class="text-center mb-16">
            <h2 class="text-4xl font-black mb-2">تسجيل الدخول</h2>
            <p class="opacity-40">ابدأ رحلة الوميض الأزرق اليوم</p>
        </div>
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
        
        <button onclick="skipLogin()" class="mt-8 text-xs opacity-20 underline">الدخول كضيف (تجريبي)</button>
    </div>

    <div id="pg-profile" class="page p-8">
        <h2 class="text-3xl font-black text-[#CCFF00] mb-8 italic uppercase">البروتوكول البدني</h2>
        <div class="space-y-6">
            <div class="card bg-white/5 p-4 rounded-3xl">
                <label class="text-[10px] opacity-40 uppercase mb-2 block">العمر الحالي</label>
                <input id="in-age" type="number" placeholder="20" class="w-full bg-transparent text-2xl font-black outline-none border-b border-white/10 pb-2">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="card bg-white/5 p-4 rounded-3xl">
                    <label class="text-[10px] opacity-40 uppercase mb-2 block">الوزن (كجم)</label>
                    <input id="in-weight" type="number" placeholder="70" class="w-full bg-transparent text-2xl font-black outline-none border-b border-white/10 pb-2">
                </div>
                <div class="card bg-white/5 p-4 rounded-3xl">
                    <label class="text-[10px] opacity-40 uppercase mb-2 block">الطول (سم)</label>
                    <input id="in-height" type="number" placeholder="175" class="w-full bg-transparent text-2xl font-black outline-none border-b border-white/10 pb-2">
                </div>
            </div>
            <div class="card bg-white/5 p-4 rounded-3xl">
                <label class="text-[10px] opacity-40 uppercase mb-2 block">مستوى اللياقة</label>
                <select id="in-level" class="w-full bg-transparent text-xl font-bold outline-none">
                    <option value="1.2">مبتدئ جداً</option>
                    <option value="1.5">متوسط</option>
                    <option value="1.9">رياضي محترف</option>
                </select>
            </div>
            <button onclick="savePhysicalData()" class="neon-btn mt-10">تحليل البيانات وحفظها</button>
        </div>
    </div>

    <div id="pg-goals" class="page p-6">
        <header class="flex justify-between items-center mb-10">
            <div>
                <p class="text-[10px] opacity-40">أهلاً بك يا بطل</p>
                <h3 id="user-name" class="text-xl font-black italic">The Blue Flash</h3>
            </div>
            <div class="w-12 h-12 rounded-full border border-[#CCFF00] overflow-hidden">
                <img id="user-img" src="https://via.placeholder.com/100" alt="Avatar">
            </div>
        </header>
        
        <h2 class="text-2xl font-black mb-6">حدد منطقة التركيز اليوم</h2>
        <div class="grid grid-cols-1 gap-4" id="goals-list">
            </div>
    </div>

    <div id="pg-routine" class="page p-6">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="nav('pg-goals')" class="text-[#CCFF00]">←</button>
            <h2 id="routine-title" class="text-3xl font-black italic">NEW ROUTINE</h2>
        </div>
        <div id="routine-container">
            </div>
        <div class="fixed bottom-24 left-6 right-6">
             <button onclick="startFullWorkout()" class="neon-btn italic text-lg shadow-2xl">SAVE & START ROUTINE ✓</button>
        </div>
    </div>

    <div id="pg-stats" class="page p-6">
        <h2 class="text-3xl font-black text-[#CCFF00] mb-8 italic">إحصائيات التقدم</h2>
        <div class="grid grid-cols-2 gap-4">
            <div class="card bg-white/5 p-6 rounded-[30px] border border-white/5 text-center">
                <h4 id="stat-cals" class="text-4xl font-black">0</h4>
                <p class="text-[9px] opacity-40 mt-2 uppercase">إجمالي السعرات</p>
            </div>
            <div class="card bg-white/5 p-6 rounded-[30px] border border-white/5 text-center">
                <h4 id="stat-workouts" class="text-4xl font-black">0</h4>
                <p class="text-[9px] opacity-40 mt-2 uppercase">تمارين منجزة</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div onclick="nav('pg-goals')" class="nav-item active" id="n-home">
            <span class="text-xs font-black italic">TRAIN</span>
        </div>
        <div onclick="nav('pg-stats')" class="nav-item" id="n-stats">
            <span class="text-xs font-black italic">STATS</span>
        </div>
        <div onclick="resetApp()" class="nav-item opacity-10">
            <span class="text-xs font-black italic">RESET</span>
        </div>
    </nav>

    <div id="modal-rest" class="modal">
        <div class="modal-content">
            <h2 class="text-3xl font-black text-[#CCFF00] mb-4 italic">تم استلام اللمسة!</h2>
            <p class="opacity-50 mb-8">استرح لمدة 30 ثانية قبل المجموعة القادمة</p>
            <button onclick="closeModal()" class="w-full py-4 bg-white/10 rounded-2xl font-bold">OK</button>
        </div>
    </div>

// 2. وظائف التشغيل المتقدمة (تعديلات على الكود السابق لضمان الاحترافية)
function renderRoutine() {
    const list = MASTER_DB[state.currentGoal] || MASTER_DB["FULL BODY"];
    const container = document.getElementById('routine-container');
    
    container.innerHTML = list.map(ex => `
        <div onclick="startEx('${ex.n}', ${ex.r}, '${ex.img}')" class="ex-card items-center active:scale-95 transition-all">
            <div class="w-20 h-20 bg-black rounded-2xl overflow-hidden border border-white/5 relative">
                <img src="${ex.img}" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-[8px] font-black bg-[#CCFF00] text-black px-2 py-1 rounded-full shadow-lg">GO</span>
                </div>
            </div>
            <div class="flex-1">
                <h4 class="text-lg font-black italic uppercase tracking-tighter">${ex.n}</h4>
                <div class="flex gap-3 mt-1">
                    <span class="text-[9px] opacity-40 font-bold uppercase tracking-widest">4 Sets</span>
                    <span class="text-[9px] opacity-40 font-bold uppercase tracking-widest">12 Reps</span>
                </div>
            </div>
            <div class="text-[#CCFF00] opacity-30">⚡</div>
        </div>
    `).join('');
}

// 3. دالة بدء التمرين مع حقن الفيديو (GIF) وتحديث الإحصائيات
function startEx(name, rate, gifUrl) {
    session.sec = 0; 
    session.sets = 1; 
    session.currentRate = rate;
    
    // تحديث صفحة المؤقت
    document.getElementById('active-ex-name').innerText = name.toUpperCase();
    document.getElementById('clock').innerText = "00:00";
    document.getElementById('cur-sets').innerText = "1/4";
    document.getElementById('exercise-video').innerHTML = `
        <img src="${gifUrl}" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
    `;
    
    showPage('pg-timer');
    
    // تشغيل العداد الحقيقي
    clearInterval(session.interval);
    session.interval = setInterval(() => {
        session.sec++;
        updateSessionUI(rate);
    }, 1000);
}

function updateSessionUI(rate) {
    let m = Math.floor(session.sec / 60), s = session.sec % 60;
    document.getElementById('clock').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    
    // معادلة الحرق البدني الحقيقي
    let user = JSON.parse(localStorage.getItem('bf_user'));
    let bmr = (10 * user.weight) + (6.25 * user.height) - (5 * user.age) + 5;
    let burned = Math.floor(((session.sec / 3600) * (bmr * user.level)) * (rate / 6));
    document.getElementById('cur-cals').innerText = burned;
    session.lastBurned = burned;
}

function handleNextSet() {
    if(session.sets < 4) {
        session.sets++;
        document.getElementById('cur-sets').innerText = `${session.sets}/4`;
        openModal(); // تفعيل رسالة "تم استلام اللمسة"
    } else {
        alert("إنجاز مذهل! تم إنهاء البروتوكول.");
        exitTraining();
    }
}

function openModal() { document.getElementById('modal-rest').style.display = 'flex'; }
function closeModal() { document.getElementById('modal-rest').style.display = 'none'; }


        // نظام الذاكرة المتقدمة
        const state = {
            user: JSON.parse(localStorage.getItem('bf_user')) || null,
            stats: JSON.parse(localStorage.getItem('bf_stats')) || { cals: 0, count: 0 },
            currentGoal: null
        };

        // تشغيل التطبيق
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    initLogic();
                }, 500);
            }, 2000);
        };

        function initLogic() {
            if (!localStorage.getItem('bf_login')) { nav('pg-login'); }
            else if (!state.user) { nav('pg-profile'); }
            else { 
                updateStatsUI();
                renderGoals();
                nav('pg-goals'); 
            }
        }

        // معالجة Google Login الحقيقي
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            localStorage.setItem('bf_login', 'true');
            localStorage.setItem('bf_google_data', JSON.stringify(responsePayload));
            document.getElementById('user-name').innerText = responsePayload.name;
            document.getElementById('user-img').src = responsePayload.picture;
            initLogic();
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        // وظائف التنقل الصارمة
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // تحديث الأزرار السفلية
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(id === 'pg-goals') document.getElementById('n-home').classList.add('active');
            if(id === 'pg-stats') document.getElementById('n-stats').classList.add('active');
        }

        function savePhysicalData() {
            const data = {
                age: document.getElementById('in-age').value,
                weight: document.getElementById('in-weight').value,
                height: document.getElementById('in-height').value,
                level: document.getElementById('in-level').value
            };
            if(!data.age || !data.weight) return alert("يرجى إكمال البروتوكول!");
            localStorage.setItem('bf_user', JSON.stringify(data));
            state.user = data;
            initLogic();
        }

        function renderGoals() {
            const goals = ["CHEST", "ABS", "ARMS", "LEGS", "FULL BODY"];
            const container = document.getElementById('goals-list');
            container.innerHTML = goals.map(g => `
                <div onclick="selectGoal('${g}')" class="ex-card">
                    <div class="w-12 h-12 bg-[#CCFF00]/10 rounded-xl flex items-center justify-center neon-text font-black">${g[0]}</div>
                    <div class="flex-1 font-black italic">${g} WORKOUT</div>
                    <div class="opacity-20 text-xs">→</div>
                </div>
            `).join('');
        }

        function selectGoal(g) {
            state.currentGoal = g;
            document.getElementById('routine-title').innerText = g + " PROTOCOL";
            renderRoutine();
            nav('pg-routine');
        }

        function renderRoutine() {
            // محاكاة سحب 10 تمارين من الـ 50 بناءً على الهدف
            const container = document.getElementById('routine-container');
            container.innerHTML = `
                <div class="ex-card items-start bg-white/[0.02] border-dashed">
                    <div class="flex-1">
                        <p class="text-[10px] text-[#CCFF00] font-black italic">ACTIVE PROTOCOL</p>
                        <h4 class="text-xl font-black italic">10 MOVEMENTS DETECTED</h4>
                    </div>
                </div>
            `;
            // إضافة التمارين... (سيتم إرسال القائمة الكاملة في الرد القادم لضمان عدم انقطاع النص)
        }

        function skipLogin() { localStorage.setItem('bf_login', 'true'); initLogic(); }
        function updateStatsUI() {
            document.getElementById('stat-cals').innerText = state.stats.cals;
            document.getElementById('stat-workouts').innerText = state.stats.count;
        }
        function resetApp() { if(confirm("حذف كل البيانات؟")) { localStorage.clear(); location.reload(); } }
    </script>
