<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Blue Flash - Elite Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #CCFF00; --bg: #0d0f05; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        .page { display: none; height: 100vh; width: 100%; position: fixed; top: 0; left: 0; background: var(--bg); overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: block !important; z-index: 100; }
        .neon-bg { background-color: var(--neon) !important; color: #000 !important; }
        .neon-text { color: var(--neon); }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; transition: 0.3s; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 12px; z-index: 200; }
        .nav-btn { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.3); text-align: center; }
        .nav-btn.active { color: var(--neon); }
        #splash { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="text-center animate-pulse">
            <h1 class="text-6xl font-black italic neon-text italic tracking-tighter">THE BLUE<br>FLASH</h1>
            <div class="mt-4 h-1 w-24 bg-[#CCFF00] mx-auto rounded-full shadow-[0_0_15px_#CCFF00]"></div>
        </div>
    </div>

    <div id="pg-login" class="page flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black neon-text mb-8 italic">مرحباً بك</h1>
        <button onclick="saveLogin()" class="w-full py-5 bg-white text-black font-black rounded-2xl flex items-center justify-center gap-3">
            <img src="https://www.google.com/favicon.ico" class="w-5"> الدخول بواسطة Google
        </button>
    </div>

    <div id="pg-onboarding" class="page p-6">
        <h2 class="text-3xl font-black neon-text mb-6 italic">بيانات البروتوكول</h2>
        <div class="space-y-4">
            <input id="u-age" type="number" placeholder="العمر" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center">
            <div class="grid grid-cols-2 gap-4">
                <input id="u-weight" type="number" placeholder="الوزن (كجم)" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                <input id="u-height" type="number" placeholder="الطول (سم)" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
            </div>
            <select id="u-level" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                <option value="1.2">مبتدئ</option>
                <option value="1.5">متوسط</option>
                <option value="1.9">متقدم</option>
            </select>
            <button onclick="saveOnboarding()" class="w-full py-5 neon-bg font-black rounded-2xl mt-4">حفظ البيانات نهائياً</button>
        </div>
    </div>

    <div id="pg-goal" class="page p-6">
        <h2 class="text-2xl font-black neon-text mb-8">ماذا ستمرن اليوم؟</h2>
        <div class="grid grid-cols-1 gap-4">
            <button onclick="setGoal('صدر')" class="card p-6 text-xl font-black italic">CHEST (صدر)</button>
            <button onclick="setGoal('بطن')" class="card p-6 text-xl font-black italic">ABS (بطن)</button>
            <button onclick="setGoal('سواعد')" class="card p-6 text-xl font-black italic">ARMS (سواعد)</button>
            <button onclick="setGoal('أقدام')" class="card p-6 text-xl font-black italic">LEGS (أقدام)</button>
            <button onclick="setGoal('كامل')" class="card p-6 text-xl font-black italic">FULL BODY (جسم كامل)</button>
        </div>
    </div>

    <div id="pg-main" class="page p-6">
        <h2 id="current-goal-title" class="text-3xl font-black neon-text italic mb-6">البرنامج اليومي</h2>
        <div id="exercise-list" class="space-y-4"></div>
    </div>

    <div id="pg-stats" class="page p-6 text-center">
        <h2 class="text-3xl font-black neon-text italic mb-8">إحصائياتك</h2>
        <div class="card p-8 mb-4">
            <div id="total-burned" class="text-5xl font-black mb-2">0</div>
            <p class="opacity-40 uppercase text-xs">إجمالي السعرات المحروقة</p>
        </div>
    </div>

    <div id="pg-timer" class="page p-6 flex flex-col items-center">
        <div id="exercise-video" class="w-full aspect-video card mb-6 overflow-hidden flex items-center justify-center">
            <span class="opacity-20 text-xs">فيديو توضيحي (GIF)</span>
        </div>
        <h3 id="active-ex-name" class="text-3xl font-black neon-text italic mb-2 uppercase"></h3>
        <div id="clock" class="text-8xl font-black italic mb-8 tracking-tighter">00:00</div>
        <div class="grid grid-cols-2 gap-4 w-full mb-8">
            <div class="card p-4 text-center"><div id="cur-cals" class="text-2xl font-black neon-text">0</div><p class="text-[9px] opacity-40">KCAL</p></div>
            <div class="card p-4 text-center"><div id="cur-sets" class="text-2xl font-black">1/4</div><p class="text-[9px] opacity-40">SETS</p></div>
        </div>
        <button onclick="handleNextSet()" class="w-full py-6 neon-bg font-black text-xl rounded-full mb-4">إنهاء المجموعة</button>
        <button onclick="exitTraining()" class="text-red-500 font-bold text-xs uppercase opacity-50">إيقاف التمرين</button>
    </div>

    <nav class="nav-bar">
        <button onclick="showPage('pg-goal')" class="nav-btn active">التمارين</button>
        <button onclick="showPage('pg-stats')" class="nav-btn">الإحصائيات</button>
        <button onclick="clearCache()" class="nav-btn text-red-500/30">Reset</button>
    </nav>

    <script>
        const exercisesDB = {
            "صدر": [{n:"Pushups",r:8}, {n:"Wide Pushups",r:9}, {n:"Diamond",r:10}, {n:"Incline",r:7}, {n:"Decline",r:11}, {n:"Archer",r:13}, {n:"Clap",r:15}, {n:"Spiderman",r:12}, {n:"One Arm Prep",r:14}, {n:"Pseudo",r:12}],
            "بطن": [{n:"Crunches",r:5}, {n:"Leg Raises",r:6}, {n:"Plank",r:4}, {n:"V-Sits",r:9}, {n:"Russian Twist",r:7}, {n:"Mountain Climber",r:8}, {n:"Hollow Body",r:5}, {n:"Bicycle",r:7}, {n:"Flutter Kicks",r:6}, {n:"Toe Touch",r:7}],
            "سواعد": [{n:"Wrist Curls",r:4}, {n:"Reverse Curls",r:5}, {n:"Knuckle Push",r:10}, {n:"Finger Push",r:12}, {n:"Dead Hang",r:3}, {n:"Towel Pull",r:8}, {n:"Forearm Plank",r:6}, {n:"Grip Squeeze",r:3}, {n:"Wrist Rotation",r:2}, {n:"Hammer Prep",r:5}],
            "أقدام": [{n:"Squats",r:8}, {n:"Lunges",r:7}, {n:"Calf Raises",r:4}, {n:"Bulgarian",r:11}, {n:"Sumo Squat",r:9}, {n:"Wall Sit",r:5}, {n:"Box Jumps",r:13}, {n:"Glute Bridge",r:6}, {n:"Pistol Prep",r:15}, {n:"Side Lunges",r:8}],
            "كامل": [{n:"Burpees",r:15}, {n:"Jumping Jacks",r:7}, {n:"Bear Crawl",r:10}, {n:"High Knees",r:9}, {n:"Navy Seals",r:18}, {n:"Plank Jacks",r:8}, {n:"Star Jumps",r:14}, {n:"Clean Prep",r:13}, {n:"T-Pushups",r:11}, {n:"Thrusters",r:14}]
        };

        let session = { sec: 0, sets: 1, interval: null, currentRate: 0, totalToday: 0 };

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 500);
                checkLogic();
            }, 2000);
        };

        function checkLogic() {
            if (!localStorage.getItem('isLoggedIn')) { showPage('pg-login'); }
            else if (!localStorage.getItem('userData')) { showPage('pg-onboarding'); }
            else { showPage('pg-goal'); }
        }

        function saveLogin() { localStorage.setItem('isLoggedIn', true); checkLogic(); }
        
        function saveOnboarding() {
            const data = { age: document.getElementById('u-age').value, weight: document.getElementById('u-weight').value, height: document.getElementById('u-height').value, level: document.getElementById('u-level').value };
            if(!data.age || !data.weight) return alert("أكمل البيانات!");
            localStorage.setItem('userData', JSON.stringify(data));
            checkLogic();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        }

        function setGoal(goal) {
            const list = exercisesDB[goal];
            document.getElementById('current-goal-title').innerText = goal.toUpperCase();
            const container = document.getElementById('exercise-list');
            container.innerHTML = list.map(ex => `
                <div onclick="startEx('${ex.n}', ${ex.r})" class="card p-5 flex justify-between items-center active:scale-95">
                    <div><h4 class="font-black italic uppercase">${ex.n}</h4><p class="text-[9px] opacity-30">4 SETS | 12 REPS</p></div>
                    <div class="neon-text font-black">START</div>
                </div>
            `).join('');
            showPage('pg-main');
        }

        function startEx(name, rate) {
            session.sec = 0; session.sets = 1; session.currentRate = rate;
            document.getElementById('active-ex-name').innerText = name;
            document.getElementById('clock').innerText = "00:00";
            document.getElementById('cur-sets').innerText = "1/4";
            showPage('pg-timer');
            clearInterval(session.interval);
            session.interval = setInterval(() => {
                session.sec++;
                let m = Math.floor(session.sec/60), s = session.sec%60;
                document.getElementById('clock').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                let user = JSON.parse(localStorage.getItem('userData'));
                let burned = Math.floor((session.sec/3600) * (10*user.weight + 6.25*user.height - 5*user.age + 5) * user.level * (rate/5));
                document.getElementById('cur-cals').innerText = burned;
                session.lastBurned = burned;
            }, 1000);
        }

        function handleNextSet() {
            if(session.sets < 4) { session.sets++; document.getElementById('cur-sets').innerText = `${session.sets}/4`; alert("استراحة محارب!"); }
            else { alert("تم الإنجاز!"); exitTraining(); }
        }

        function exitTraining() {
            clearInterval(session.interval);
            session.totalToday += (session.lastBurned || 0);
            document.getElementById('total-burned').innerText = session.totalToday;
            showPage('pg-goal');
        }

        function clearCache() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
